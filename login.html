<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusFix - Login</title>

    <link rel="stylesheet" href="login.css">

</head>


<body>

    <div class="login-container">

        <div class="login-left">

            <h1>CampusFix</h1>

            <h2>Welcome Back 👋</h2>

            <p>
                Login to report campus problems and
                track your complaints.
            </p>

            <a href="index.html">
                ← Back to Home
            </a>

        </div>


        <div class="login-box">

            <h2>CampusFix Login</h2>

            <p class="subtitle">
                Login to your CampusFix account
            </p>


            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>


    <script>

        // =========================================
        // LOGIN FORM
        // =========================================

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;

                    const submitButton =
                        event.currentTarget.querySelector(
                            "button[type=submit]"
                        );


                    if (!email || !password) {

                        alert(
                            "Please fill all fields."
                        );

                        return;

                    }


                    try {

                        submitButton.disabled = true;

                        const response =
                            await fetch(
                                "/api/login",
                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json"

                                    },

                                    body:
                                        JSON.stringify({

                                            email:
                                                email,

                                            password:
                                                password

                                        })

                                }
                            );


                        const data =
                            await response.json();


                        // =========================================
                        // LOGIN SUCCESS
                        // =========================================

                        if (response.ok) {


                            // Clear old login data first

                            localStorage.removeItem(
                                "campusfixToken"
                            );

                            localStorage.removeItem(
                                "campusfixUser"
                            );


                            // Save NEW token

                            localStorage.setItem(
                                "campusfixToken",
                                data.token
                            );


                            // Make sure user data contains role

                            const loggedInUser = {

                                id:
                                    data.user.id,

                                name:
                                    data.user.name,

                                email:
                                    data.user.email,

                                role:
                                    data.user.role ||
                                    "student"

                            };


                            // Save user

                            localStorage.setItem(

                                "campusfixUser",

                                JSON.stringify(
                                    loggedInUser
                                )

                            );


                            console.log(
                                "Logged in user:",
                                loggedInUser
                            );


                            alert(
                                "Login successful! ✅"
                            );


                            // =========================================
                            // ADMIN REDIRECT
                            // =========================================

                            if (
                                loggedInUser.role ===
                                "admin"
                            ) {

                                window.location.href =
                                    "admin.html";

                            }

                            // =========================================
                            // STUDENT REDIRECT
                            // =========================================

                            else {

                                window.location.href =
                                    "dashboard.html";

                            }


                        }

                        else {

                            alert(

                                data.message ||

                                "Invalid email or password ❌"

                            );

                        }


                    }

                    catch (error) {

                        console.error(
                            "Login Error:",
                            error
                        );


                        alert(
                            "Cannot connect to CampusFix server ❌"
                        );

                    }

                    finally {

                        submitButton.disabled = false;

                    }

                }
            );

    </script>


</body>

</html>
